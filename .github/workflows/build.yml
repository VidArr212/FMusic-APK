name: Build & Release FMusic APK

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK File
        run: |
          mkdir -p release_output
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_output/FMusic-v1.0.01.apk
            cp app/build/outputs/apk/debug/app-debug.apk FMusic-v1.0.01.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FMusic-v1.0.01-APK
          path: FMusic-v1.0.01.apk
          if-no-files-found: error

      - name: Create or Update GitHub Release (Direct .apk Download)
        uses: softprops/action-gh-release@v2
        with:
          files: release_output/FMusic-v1.0.01.apk
          name: "FMusic Release v1.0.01"
          tag_name: "v1.0.01"
          body: |
            ### 🎵 FMusic Android App - Version 1.0.01

            Direct APK Download available below! (Langsung download file `.apk` tanpa `.zip`)

            #### 🚀 Fitur Utama:
            - **Spotify Dark Blue & Electric Neon UI**: Desain Midnight Blue dengan Neon Cyan/Blue audio progress bar.
            - **BootScreen / Splash Screen**: Dilengkapi animasi logo dan versi 1.0.01.
            - **Skeleton Shimmer Loading**: Animasi loading halus.
            - **Home**: Mix Indo Music, Trending, Quick Picks, Album & Artist discovery.
            - **Search**: Auto-suggestions, filter kategori (Songs, Videos, Albums, Artists, Playlists), Riwayat pencarian (bisa hapus/clear), Recently Played, dan Browse All kategori berwarna.
            - **Charts**: Tangga lagu video & top tracks bernomor urut, video musik, genre, dan artis teratas.
            - **Library**: Tabs Playlists, Favorites, Saved Offline, History, Stats, + New Playlist, Backup & Restore.
            - **Music Player**: Mini Player & Full Player dengan Cover Art, Explicit badge (E), Neon Seekbar, Sleep Timer (5-30m), Tombol Share, Lirik Karaoke real-time (*synchronized scrolling*), Tentang Artis, dan Unduh Offline (MP3).
            - **Background Audio**: AndroidX Media3 ExoPlayer foreground service dengan kontrol notifikasi.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
