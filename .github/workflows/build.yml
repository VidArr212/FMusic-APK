name: Build & Release FMusic APK

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Generate Wrapper & Build Debug APK
        run: |
          gradle wrapper --gradle-version 8.6
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare Direct APK File
        run: |
          mkdir -p release_output
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk release_output/FMusic-v1.0.1.apk
            cp app/build/outputs/apk/debug/app-debug.apk FMusic-v1.0.1.apk
          fi

      - name: Publish Direct .apk to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.1 --yes || true
          git tag -f v1.0.1
          git push origin v1.0.1 --force || true
          gh release create v1.0.1 release_output/FMusic-v1.0.1.apk \
            --title "🎵 FMusic Release v1.0.1" \
            --notes "### 🎵 FMusic Android App - Version 1.0.1 (Direct APK Download)

          - 💉 **Embedded Direct Music API**: Berjalan 100% standalone tanpa server tambahan.
          - ⚡ **In-App Auto Updater**: Fitur update otomatis langsung di dalam aplikasi.
          - 🎨 **Midnight Blue & Electric Neon UI**: Desain Spotify Dark Blue & Neon.

          Klik file **FMusic-v1.0.1.apk** di bawah untuk langsung download file APK tanpa .zip!"

      - name: Upload Artifact (Fallback)
        uses: actions/upload-artifact@v4
        with:
          name: FMusic-v1.0.1-APK
          path: FMusic-v1.0.1.apk
          if-no-files-found: error
