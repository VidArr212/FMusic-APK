name: Build & Release FMusic APK

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Debug & Release APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Release
        run: |
          mkdir -p output
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk output/FMusic-v1.0.01.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FMusic-v1.0.01-APK
          path: output/FMusic-v1.0.01.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: output/FMusic-v1.0.01.apk
          name: FMusic Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ### 🎵 FMusic Android App - Version 1.0.01
            - Spotify-inspired Dark Blue & Electric Neon UI
            - Music Streaming & Offline Local Storage
            - Real-time Synchronized Lyrics & Sleep Timer
            - Search History, Recently Played, Charts & Custom Playlists
            - Built with Kotlin & Jetpack Compose
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
