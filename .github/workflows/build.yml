name: Build & Release FMusic APK

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Extract Version Name from build.gradle.kts
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=FMusic-v$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Generate Wrapper & Build Release APK
        run: |
          gradle wrapper --gradle-version 8.6
          chmod +x ./gradlew
          ./gradlew assembleRelease -x lint -x lintVitalRelease -x test --stacktrace

      - name: Prepare Signed APK File
        run: |
          mkdir -p release_output
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            APK_SRC=$(find app/build/outputs/apk/release/ -name "*.apk" ! -name "*unsigned*" | head -1)
          fi
          if [ ! -f "$APK_SRC" ]; then
            APK_SRC=$(find app/build/outputs/apk/ -name "*.apk" | head -1)
          fi
          echo "Using APK: $APK_SRC"
          cp "$APK_SRC" "release_output/${{ steps.version.outputs.apk_name }}"
          cp "$APK_SRC" "${{ steps.version.outputs.apk_name }}"

      - name: Publish Direct .apk to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ steps.version.outputs.tag }}" --yes || true
          git tag -f "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}" --force || true
          gh release create "${{ steps.version.outputs.tag }}" "release_output/${{ steps.version.outputs.apk_name }}" \
            --title "🎵 FMusic Release ${{ steps.version.outputs.tag }}" \
            --notes "### 🎵 FMusic Android App - Version ${{ steps.version.outputs.version }}

          **Changelog v${{ steps.version.outputs.version }}:**
          - 🔧 **Fix Force Close**: JSON parsing aman dari recursive stack overflow
          - 🎵 **Fix Audio Playback**: Multi-provider stream (6 Piped + 4 Invidious) dengan auto-retry
          - 🎨 **Fix Genre/Moods Grid**: Kategori di Search sekarang tampil rapi 2 kolom
          - 🎨 **Fix Mood Colors**: Warna kategori mood akurat
          - 🔑 **Signed APK**: APK sudah di-sign dan siap di-install di semua perangkat Android
          - ⚡ **In-App Auto Updater**: Update otomatis langsung dari aplikasi

          Klik file **${{ steps.version.outputs.apk_name }}** di bawah untuk download langsung!"

      - name: Upload Artifact (Fallback)
        uses: actions/upload-artifact@v4
        with:
          name: FMusic-${{ steps.version.outputs.version }}-APK
          path: ${{ steps.version.outputs.apk_name }}
          if-no-files-found: error
